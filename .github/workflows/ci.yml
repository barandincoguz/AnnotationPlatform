name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        # Block syntax/undefined-name regressions now; the remaining legacy
        # import-order/unused-symbol debt is tracked separately.
        run: ruff check --select E9,F63,F7,F82 backend tests scripts
      - name: pytest
        run: python -m pytest tests/ -q -m "not docker"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint src
      - name: vitest
        run: npx vitest run --pool=threads --poolOptions.threads.maxThreads=2

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps in the path used by Playwright
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: OpenAPI types are current
        working-directory: frontend
        run: npm run gen:types:check
      - name: Playwright
        working-directory: frontend
        run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - name: Install smoke deps
        run: python -m pip install pytest
      - name: Docker config + image smoke
        run: python -m pytest tests/test_docker_config.py tests/test_docker_smoke.py -q
