services:
  app:
    build: .
    image: anotasyon-platform:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - anotasyon_data:/data
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-anotasyon_session}
      - SESSION_MAX_AGE_SECONDS=${SESSION_MAX_AGE_SECONDS:-2592000}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BACKUP_REPO_URL=${BACKUP_REPO_URL:-}
      - GITHUB_PAT=${GITHUB_PAT:-}
      - TRUST_FORWARDED_FOR=${TRUST_FORWARDED_FOR:-0}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - NEON_MIRROR_URL=${NEON_MIRROR_URL:-}
      - NEON_MIRROR_BATCH_SIZE=${NEON_MIRROR_BATCH_SIZE:-100}
      - NEON_MIRROR_MAX_RETRIES=${NEON_MIRROR_MAX_RETRIES:-5}
      - NEON_MIRROR_EMPTY_SLEEP=${NEON_MIRROR_EMPTY_SLEEP:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  anotasyon_data:
